services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: saas_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  redis:
    image: redis:7
    restart: always
    ports:
      - '6379:6379'

  server:
    build: ./server
    restart: always
    environment:
      DATABASE_URL: postgres://postgres:password@postgres:5432/saas_db
      REDIS_URL: redis://redis:6379
    ports:
      - '5001:5000' # host:container mapping
    depends_on:
      - postgres
      - redis
    volumes:
      - ./server:/app
    command: sh -c "npm install && npm run dev"

volumes:
  pgdata:
