name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

defaults:
  run:
    working-directory: .

jobs:
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: saas_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --entrypoint redis-server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # Install server dependencies
      - name: Install server dependencies
        working-directory: ./server
        run: npm ci

      # Install client dependencies
      - name: Install client dependencies
        working-directory: ./client
        run: npm ci

      # Lint server code
      - name: Lint server code
        working-directory: ./server
        run: npm run lint

      # Type check server code
      - name: Type check server code
        working-directory: ./server
        run: npm run typecheck

      # Run server tests
      - name: Run server tests
        working-directory: ./server
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:password@localhost:5432/saas_db_test
          REDIS_URL: redis://localhost:6379
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npm test

      # Run client tests
      - name: Run client tests
        working-directory: ./client
        run: npm test

      # Build client
      - name: Build client
        working-directory: ./client
        run: npm run build
